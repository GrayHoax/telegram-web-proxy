# Builds the image and publishes it to Docker Hub:
#   docker.io/grayhoax/telegram-web-proxy:latest, :sha-<short>, :<tag>
# Runs on every push to the default branch, on tags, weekly (fresh base images
# and security updates) and manually. Pull requests are built but not pushed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account name (grayhoax)
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
name: docker-image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      tproxy_ref:
        description: "Upstream tproxy-server ref (empty = the pinned commit, or 'master')"
        required: false
        default: ""

env:
  IMAGE: docker.io/grayhoax/telegram-web-proxy

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build arguments
        id: args
        env:
          TPROXY_REF: ${{ github.event.inputs.tproxy_ref }}
        # REFRESH = ISO week: OS updates and "latest" Go dependencies are
        # re-resolved at least weekly despite the build cache.
        run: |
          {
            echo "build_args<<EOF"
            echo "REFRESH=$(date -u +%G-W%V)"
            if [ -n "$TPROXY_REF" ]; then echo "TPROXY_REF=$TPROXY_REF"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Build once into the local Docker engine so the image can be scanned
      # before anything is published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: telegram-web-proxy:ci
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -e TPROXY_HOSTNAME=proxy.example.com -e TLS_MODE=off \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add KILL \
            telegram-web-proxy:ci
          for i in $(seq 1 30); do
            docker exec smoke tgweb-net get -o /dev/null http://127.0.0.1:9081/healthz && break
            sleep 2
          done
          docker exec smoke tgweb-net get -o /dev/null http://127.0.0.1:9081/healthz
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke

      # Fails the job on critical/high CVEs that already have a fix, so a
      # vulnerable image is never pushed. Requires the Docker Hub login above.
      - name: Vulnerability scan (Docker Scout)
        if: github.event_name != 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://telegram-web-proxy:ci
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=gha
