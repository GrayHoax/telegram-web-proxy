# Builds the image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest, :<git-sha>, :<tag>
# Runs on every push to the default branch, on tags, weekly (fresh base images
# and security updates) and manually.
name: docker-image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      tproxy_ref:
        description: "Upstream tproxy-server ref (empty = the pinned commit, or 'master')"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build arguments
        id: args
        run: |
          if [ -n "${{ github.event.inputs.tproxy_ref }}" ]; then
            echo "build_args=TPROXY_REF=${{ github.event.inputs.tproxy_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "build_args=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
