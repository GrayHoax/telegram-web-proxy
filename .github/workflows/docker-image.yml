# Builds the image and publishes it to Docker Hub:
#   docker.io/grayhoax/telegram-web-proxy:latest, :sha-<short>, :<tag>
# Runs on every push to the default branch, on tags, weekly (fresh base images
# and security updates) and manually. Pull requests are built but not pushed.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account name (grayhoax)
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
name: docker-image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      tproxy_ref:
        description: "Upstream tproxy-server ref (empty = the pinned commit, or 'master')"
        required: false
        default: ""

env:
  IMAGE: docker.io/grayhoax/telegram-web-proxy

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build arguments
        id: args
        env:
          TPROXY_REF: ${{ github.event.inputs.tproxy_ref }}
        run: |
          if [ -n "$TPROXY_REF" ]; then
            echo "build_args=TPROXY_REF=$TPROXY_REF" >> "$GITHUB_OUTPUT"
          else
            echo "build_args=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
