# Apache httpd 2.4.47+ in front of tgweb-proxy (127.0.0.1:8080, TLS_MODE=off).
# Modules: a2enmod ssl proxy proxy_http proxy_http2 headers http2
# (2.4.47+ handles WebSocket with "upgrade=websocket"; older versions need
# mod_proxy_wstunnel and a separate rule for /<base_path>/api/v1/ws.)

<VirtualHost *:80>
    ServerName proxy.example.com
    Redirect permanent / https://proxy.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName proxy.example.com
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/proxy.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/proxy.example.com/privkey.pem

    # Do not log carrier URIs.
    CustomLog /dev/null common

    ProxyRequests     Off
    # The relay checks Host.
    ProxyPreserveHost On
    # The relay long poll is 25 s.
    ProxyTimeout      90
    # Uplink batches reach 2 MiB.
    LimitRequestBody  4194304

    # Exactly one client address in X-Forwarded-For.
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"

    # Mode A: every path. For Mode B use "/phcf2vfe7zgbrslg/" on both sides.
    ProxyPass        / http://127.0.0.1:8080/ upgrade=websocket flushpackets=on keepalive=On
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
