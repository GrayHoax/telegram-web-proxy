# HAProxy 2.x in front of tgweb-proxy (127.0.0.1:8080, TLS_MODE=off).
# /etc/haproxy/certs/proxy.example.com.pem = fullchain + private key.

defaults
    mode http
    timeout connect 5s
    timeout client  90s      # relay long poll is 25 s
    timeout server  90s
    timeout tunnel  1h       # WebSocket carriers
    timeout http-request 10s

frontend https
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/proxy.example.com.pem alpn h2,http/1.1
    http-request redirect scheme https unless { ssl_fc }
    # no "option httplog": carrier URIs must not be logged

    acl host_proxy hdr(host) -i proxy.example.com
    # Mode B (existing site): additionally require the prefix
    # acl tgweb_prefix path_beg /phcf2vfe7zgbrslg/
    use_backend tgweb_proxy if host_proxy

backend tgweb_proxy
    # Exactly one client address; Host is passed through unchanged by default.
    http-request set-header X-Forwarded-For %[src]
    server tgweb 127.0.0.1:8080
