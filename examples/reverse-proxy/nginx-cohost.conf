# nginx, Mode B: an existing website keeps serving "/", only the random base
# path goes to tgweb-proxy. Replace phcf2vfe7zgbrslg with TPROXY_BASE_PATH from
# .env (or `docker exec tgweb-proxy show-link`).
#
# Put a copy of the same website into ./site so that unknown URLs under the
# prefix return the same 404 page as the rest of the site.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream tgweb_proxy {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 4m;

    # ^~ keeps regex locations from stealing the prefix. No URI after the
    # upstream name: the prefix must reach the relay unchanged.
    location ^~ /phcf2vfe7zgbrslg/ {
        proxy_pass http://tgweb_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering off;
        access_log off;
    }

    # Your existing website, unchanged.
    location / {
        root /var/www/example.com;
        index index.html;
    }
}
