# nginx in front of tgweb-proxy (container started with compose.behind-proxy.yaml,
# listening on 127.0.0.1:8080, TLS_MODE=off).
#
# Mode A (recommended): a dedicated hostname, EVERY path goes to the container.
# The container itself serves the cover site and hides the proxy under the
# random base path.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream tgweb_proxy {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx < 1.25.1: "listen 443 ssl http2;"
    server_name proxy.example.com;

    ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;

    # Uplink batches reach 2 MiB; the nginx default of 1 MiB would answer 413.
    client_max_body_size 4m;

    # Never log carrier URIs, the bridge capability or Authorization headers.
    access_log off;

    location / {
        proxy_pass http://tgweb_proxy;
        proxy_http_version 1.1;

        proxy_set_header Host $host;                    # the relay checks Host
        proxy_set_header X-Forwarded-For $remote_addr;  # exactly one address
        proxy_set_header Upgrade $http_upgrade;         # WebSocket carriers
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 90s;     # relay long poll is 25 s
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
